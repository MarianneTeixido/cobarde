<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COBARDE</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #ui { position: fixed; right: 12px; top: 12px; z-index: 10; font: 12px/1.3 monospace; color: #fff; }
  #ui button { background: #000; color: #fff; border: 1px solid #fff; padding: 4px 8px; font: inherit; cursor: pointer; }
  #panel { display: none; margin-top: 6px; width: min(300px, calc(100vw - 24px)); max-height: calc(100vh - 60px); overflow: auto;
           background: rgba(0,0,0,.85); border: 1px solid #fff; padding: 10px; box-sizing: border-box; }
  #panel.open { display: block; }
  #panel label { display: block; margin: 8px 0 2px; opacity: .7; }
  #panel input { width: 100%; box-sizing: border-box; background: #000; color: #fff; border: 1px solid #888; padding: 4px; font: inherit; }
  #panel .sl { display: flex; gap: 6px; align-items: center; }
  #panel .sl input[type=range] { padding: 0; }
  #panel .sl input[type=number] { width: 64px; flex: none; }
  #panel .modes { display: flex; gap: 6px; }
  #panel .modes button.on { background: #fff; color: #000; }
  #panel .row { display: flex; gap: 6px; margin-top: 10px; }
</style>
</head>
<body>
<div id="ui">
  <button id="tg">texto</button>
  <div id="panel"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
<script>
  const canvas = document.createElement('canvas')
  document.body.appendChild(canvas)
  // buffer persistente para poder exportar la imagen
  canvas.getContext('webgl', { preserveDrawingBuffer: true, antialias: false })
  const hydra = new Hydra({ canvas, detectAudio: false, makeGlobal: true, enableStreamCapture: false })
  // stub de audio (el sketch usa mic = false)
  window.a = { show() {}, hide() {}, setBins() {}, setSmooth() {}, fft: [0, 0, 0, 0] }
</script>
<script>
mic = false
if (mic) { a.show(); a.setBins(4); a.setSmooth(0.85) } else { a.hide() }
lvl = () => mic ? a.fft[0] : 0.25 + 0.2 * Math.sin(time * 0.37) * Math.sin(time * 1.3)
mx = () => (mouse.x / innerWidth) || 0.5
my = () => (mouse.y / innerHeight) || 0.5

// ---- texto responsivo ----
dpr = Math.min(devicePixelRatio || 1, 2)
mkc = () => document.createElement('canvas')
T = mkc(); HL = mkc(); P = mkc(); pc = P.getContext('2d')
FW = 0; FH = 0   // tamaño fijo (px) durante la exportación
mode = 1   // 0 ninguno · 1 desgarro · 2 vórtice · 3 borrar realidad

// ---- puntero ----
px = 0.5; py = 0.5; vel = 0; down = false; lx = null; ly = null
paint = () => {
  let r = P.width * (0.06 + vel * 0.18)
  let g = pc.createRadialGradient(px * P.width, py * P.height, 0, px * P.width, py * P.height, r)
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)')
  pc.fillStyle = g; pc.fillRect(px * P.width - r, py * P.height - r, r * 2, r * 2)
}
inUI = e => e.target.closest && e.target.closest('#ui')
window.onpointerdown = e => {
  if (inUI(e)) return
  down = true; px = e.clientX / innerWidth; py = e.clientY / innerHeight; lx = px; ly = py
  if (mode === 3) paint()
}
window.onpointermove = e => {
  if (inUI(e)) return
  let x = e.clientX / innerWidth, y = e.clientY / innerHeight
  if (lx !== null) vel = Math.min(1, vel * 0.6 + Math.hypot(x - lx, y - ly) * 4)
  px = x; py = y; lx = x; ly = y
  if (mode === 3 && (down || e.pointerType === 'mouse')) paint()
}
window.onpointerup = () => { down = false }
window.onpointercancel = () => { down = false; lx = null }
cancelAnimationFrame(window._raf)
decay = () => { vel *= 0.93; window._raf = requestAnimationFrame(decay) }
decay()
DEFQ = 'do you still love me?'
DEF = [
  '404: cobarde',                           // 0 chico
  'LOVE',                                   // 1 grande
  'not',                                    // 2 chico
  'FOUND',                                  // 3 grande (tachado)
  '404 love not found',                     // 4 vertical
  'error 404 - love not found',             // 5 pie
  'please come back to me, and love me again.'// 6 pie
]
BASE = DEF.slice()
Q = DEFQ
SPLIT = 1; JIT = 1   // desfase RGB del texto y temblor
big = s => '500 ' + s + 'px sans-serif'
mono = s => s + 'px monospace'

layout = () => {
  W = FW || Math.round(innerWidth * dpr); H = FH || Math.round(innerHeight * dpr)
  T.width = HL.width = W; T.height = HL.height = H
  P.width = Math.round(W / 3); P.height = Math.round(H / 3)
  let c = T.getContext('2d')
  let mn = Math.min(W, H), m = mn * 0.06, fs = Math.max(10 * dpr, mn * 0.032)
  let uw = W - 2 * m - fs * 3.2
  let fit = (f, s, mw, cap) => { c.font = f(100); return Math.min(100 * mw / c.measureText(s).width, cap) }

  // pie: 3 renglones (2 fijos + prompt)
  let sB = Math.min(fs, fit(mono, BASE[6], uw, 1e4))
  let yb = H - m - sB * 3.4

  // renglones chicos (404: cobarde / not) y grandes (LOVE / FOUND)
  let sS = Math.min(fs * 1.3, fit(mono, BASE[0], uw * 0.5, 1e4), fit(mono, BASE[2], uw * 0.5, 1e4))
  let sz = Math.min(fit(big, BASE[1], uw, H * 0.19), fit(big, BASE[3], uw * 1.05, H * 0.19))
  let blockH = sS * 1.4 + sz * 0.75 + sS * 1.6 + sz * 0.75
  let top = m, room = yb - sB * 1.5 - top
  if (blockH > room) { let k = room / blockH; sS *= k; sz *= k; blockH = room }
  let y = top + (room - blockH) / 2
  let y0 = y += sS, y1 = y += sS * 0.5 + sz * 0.75, y2 = y += sS * 1.7, y3 = y += sz * 0.8

  c.font = big(sz)
  L = {
    m, fs, sS, sz, sB, y0, y1, y2, y3, yb,
    xF: 0, wF: c.measureText('FOUND').width
  }
}
layout()

G = '█▓▒░#@%&/\\<>_|'
amt = 0; t0 = performance.now()
cor = s => s.split('').map(ch => ch !== ' ' && Math.random() < amt
  ? G[Math.floor(Math.random() * G.length)] : ch).join('')

draw = (cnv, halo, S) => {
  let c = cnv.getContext('2d'), { m, fs, sS, sz, sB, y0, y1, y2, y3, yb, xF, wF } = L
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H)
  c.fillStyle = '#fff'; c.strokeStyle = '#fff'; c.lineJoin = 'round'; c.lineWidth = fs * 0.9
  let tx = (f, s, x, yy) => { c.font = f; if (halo) c.strokeText(s, x, yy); c.fillText(s, x, yy) }

  tx(mono(sS), S[0], m + sS * 0.3, y0)
  tx(big(sz), S[1], m, y1)
  tx(mono(sS), S[2], m + sS * 0.3, y2)
  tx(big(sz), S[3], m * 0.7, y3)

  // tachón sobre FOUND
  c.fillRect(m * 0.7 + xF, y3 - sz * 0.38, wF * (0.92 + 0.12 * Math.sin(time * 3)),
    halo ? sz * 0.12 : sz * 0.05)

  // vertical a la derecha
  c.save(); c.translate(W - m * 0.35, H - m); c.rotate(-Math.PI / 2)
  c.font = mono(fs * 0.9)
  let reps = Math.ceil(H / c.measureText(S[4] + '   ').width) + 1
  tx(mono(fs * 0.9), (S[4] + '   ').repeat(reps), 0, 0)
  c.restore()

  // pie
  tx(mono(sB), S[5], m, yb)
  tx(mono(sB), S[6], m, yb + sB * 1.7)
  tx(mono(sB), S[7], m, yb + sB * 3.4)
}

tick = () => {
  amt = Math.random() < 0.15 ? 0.25 : Math.random() < 0.3 ? 0.04 : 0
  amt = Math.max(amt, Math.min(0.55, vel * 0.9))
  let el = (performance.now() - t0) / 1000
  let q = Q
  let n = Math.min(q.length, Math.floor((el % 9) * 7))
  let S = BASE.concat('> ' + q.slice(0, n) + (Math.floor(el * 2) % 2 ? '_' : ' ')).map(cor)
  draw(T, false, S); draw(HL, true, S)
  pc.fillStyle = 'rgba(0,0,0,0.07)'; pc.fillRect(0, 0, P.width, P.height)
}
tick(); clearInterval(window._ti); window._ti = setInterval(tick, 110)
window.onresize = () => { layout(); setResolution(W, H); tick() }
setResolution(W, H)
s0.init({ src: T, dynamic: true })
s1.init({ src: HL, dynamic: true })
s2.init({ src: P, dynamic: true })

// ---- interfaz de texto ----
LABELS = ['renglón 1 (chico)', 'renglón 2 (grande)', 'renglón 3 (chico)', 'renglón 4 (grande, tachado)',
  'texto vertical', 'pie 1', 'pie 2', 'pregunta final (se escribe sola)']
getVals = () => BASE.concat(Q)
setVals = v => { BASE = v.slice(0, 7); Q = v[7] }
// cargar desde la URL
;(() => {
  let p = new URLSearchParams(location.search), v = getVals(), any = false
  v.forEach((_, i) => { if (p.has('t' + i)) { v[i] = p.get('t' + i); any = true } })
  if (p.has('m')) mode = Math.max(0, Math.min(4, +p.get('m') || 0))
  if (p.has('d')) SPLIT = +p.get('d') || 0
  if (p.has('j')) JIT = +p.get('j') || 0
  if (any) { setVals(v); layout(); tick() }
})()
saveURL = () => {
  let p = new URLSearchParams(), v = getVals()
  v.forEach((x, i) => { if (x !== (i < 7 ? DEF[i] : DEFQ)) p.set('t' + i, x) })
  if (mode !== 1) p.set('m', mode)
  if (SPLIT !== 1) p.set('d', SPLIT)
  if (JIT !== 1) p.set('j', JIT)
  let qs = p.toString()
  history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''))
}
panel = document.getElementById('panel')
ml = document.createElement('label'); ml.textContent = 'modo (teclas 0-4): 1 original · 2 vórtice · 3 borrar realidad · 4 cámara'
mrow = document.createElement('div'); mrow.className = 'modes'
modeBtns = [0, 1, 2, 3, 4].map(k => {
  let b = document.createElement('button'); b.textContent = k === 0 ? 'ninguno' : k
  b.onclick = () => setMode(k); mrow.append(b); return b
})
camOn = false
initCamOnce = () => { if (camOn) return; camOn = true; try { s3.initCam() } catch (e) { camOn = false; console.warn(e) } }
setMode = k => { mode = k; if (k === 4) initCamOnce(); modeBtns.forEach((b, i) => b.classList.toggle('on', i === k)); saveURL() }
panel.append(ml, mrow)
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return
  if (e.key === 's' || e.key === 'S') { saveImg(); return }
  if (e.key === 'h' || e.key === 'H') { let u = document.getElementById('ui'); u.style.display = u.style.display === 'none' ? '' : 'none'; return }
  if ('01234'.includes(e.key) && e.key.length === 1) setMode(+e.key)
})
inputs = LABELS.map((lb, i) => {
  let l = document.createElement('label'); l.textContent = lb
  let inp = document.createElement('input'); inp.value = getVals()[i]; inp.spellcheck = false
  inp.oninput = () => { let v = getVals(); v[i] = inp.value; setVals(v); layout(); tick(); saveURL() }
  panel.append(l, inp); return inp
})
mkSlider = (lb, get, set, max) => {
  let l = document.createElement('label'); l.textContent = lb
  let w = document.createElement('div'); w.className = 'sl'
  let r = document.createElement('input'); r.type = 'range'; r.min = 0; r.max = max; r.step = 0.05
  let n = document.createElement('input'); n.type = 'number'; n.min = 0; n.max = max; n.step = 0.05
  r.value = n.value = get()
  let f = v => { v = Math.max(0, Math.min(max, +v || 0)); set(v); r.value = n.value = v; saveURL() }
  r.oninput = () => f(r.value); n.oninput = () => f(n.value)
  w.append(r, n); panel.append(l, w)
  return v => { r.value = n.value = v }
}
syncD = mkSlider('desfase del texto (0 = nada, 1 = original)', () => SPLIT, v => SPLIT = v, 6)
syncJ = mkSlider('temblor del texto (0 = quieto, 1 = original)', () => JIT, v => JIT = v, 6)
row = document.createElement('div'); row.className = 'row'
bCopy = document.createElement('button'); bCopy.textContent = 'copiar link'
bCopy.onclick = () => { navigator.clipboard.writeText(location.href); bCopy.textContent = '¡copiado!'; setTimeout(() => bCopy.textContent = 'copiar link', 1200) }
bReset = document.createElement('button'); bReset.textContent = 'restaurar'
bReset.onclick = () => { setVals(DEF.concat(DEFQ)); inputs.forEach((x, i) => x.value = getVals()[i]); SPLIT = JIT = 1; setMode(1); syncD(1); syncJ(1); layout(); tick(); saveURL() }
row.append(bCopy, bReset); panel.append(row)

// ---- descargar imagen ----
dl = document.createElement('div'); dl.className = 'sl'; dl.style.marginTop = '10px'
MAXPX = 5000
mkPx = v => { let n = document.createElement('input'); n.type = 'number'; n.min = 1; n.max = MAXPX; n.step = 1; n.value = v
  n.style.cssText = 'width:70px;flex:1;background:#000;color:#fff;border:1px solid #888;padding:4px;font:inherit'
  n.onchange = () => { n.value = Math.max(1, Math.min(MAXPX, Math.round(+n.value || v))) }; return n }
inW = mkPx(5000); inH = mkPx(5000)
sz = document.createElement('label'); sz.textContent = 'tamaño de exportación en px (ancho × alto, máx 5000)'
bDl = document.createElement('button'); bDl.textContent = 'descargar PNG'
saveImg = () => {
  if (bDl.disabled) return
  let base = dpr
  let w = Math.max(1, Math.min(MAXPX, Math.round(+inW.value) || MAXPX)), h = Math.max(1, Math.min(MAXPX, Math.round(+inH.value) || MAXPX))
  inW.value = w; inH.value = h
  bDl.textContent = 'renderizando…'; bDl.disabled = true
  FW = w; FH = h; dpr = Math.min(w, h) / Math.min(innerWidth, innerHeight)
  layout(); setResolution(W, H); tick()
  setTimeout(() => {
    canvas.toBlob(b => {
      let a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'cobarde.png'; a.click()
      setTimeout(() => URL.revokeObjectURL(a.href), 2000)
      FW = FH = 0; dpr = base; layout(); setResolution(W, H); tick()
      bDl.textContent = 'descargar PNG'; bDl.disabled = false
    }, 'image/png')
  }, 900)
}
bDl.onclick = saveImg
dl.append(inW, inH, bDl); panel.append(sz, dl)
hint = document.createElement('label'); hint.textContent = 'teclas: h ocultar/mostrar este botón · s guardar PNG'
panel.append(hint)
setMode(mode)
document.getElementById('tg').onclick = () => panel.classList.toggle('open')

kx = () => 1
tk = a => () => Math.random() < 0.07 ? JIT * a * (Math.random() - 0.5) : 0

// ---- o0: rejilla de franjas que se come a o1 (y al texto) por diferencia ----
osc(18, 0.1, 0).color(1.6, 0.1, 2)
  .mult(osc(20, 0.01, 0))
  .repeat(2, 20)
  .rotate(() => 0.5 + (mx() - 0.5) * 0.6)
  .modulate(o1, () => 0.7 + lvl() * 0.6)
  .scale(1, () => 1.6 + lvl() * 0.9 + my() * 0.8)
  .diff(o1)
  .diff(src(s0).modulate(o1, 0.02), () => mode === 1 ? 0.6 : 1)
  // 3 · borrar realidad
  .modulate(src(s2).modulate(noise(3, 0.4), 0.1), () => mode === 3 ? 0.14 : 0)
  // 4 · modulate con la cámara
  .modulate(src(s3).scale(1, -1, 1).saturate(1.5), () => mode === 4 ? 0.25 + lvl() * 0.3 : 0)
  .out(o0)

// ---- o1: franjas finas azul/magenta que giran con o0 ----
osc(20, 0.2, 0).color(0.35, 0.15, 2)
  .mult(osc(40, 0.02).color(1, 0.3, 1.4))
  .modulateRotate(o0, () => 0.2 + (mx() - 0.5) * 0.3)
  .rotate(0.2)
  // 2 · vórtice
  .scale(
    () => mode === 2 ? 1 + (down ? 0.05 : 0.012) + vel * 0.08 : 1,
    1, 1,
    () => mode === 2 ? px : 0.5,
    () => mode === 2 ? 1 - py : 0.5)
  .rotate(() => mode === 2 ? (px - 0.5) * 0.05 : 0)
  .out(o1)

// ---- post: paleta + tearing ----
src(o0)
  .color(0.8, 0.42, 1.1)
  .saturate(1.15)
  .contrast(1.25)
  .modulateScrollX(noise(2, 0.6).scale(1, 80, 1).thresh(0.75), () => Math.random() < 0.15 ? 0.12 : 0.02)
  .out(o2)

// ---- split RGB + texto legible encima ----
src(o2).color(1, 0, 0.15)
  .add(src(o2).scrollX(() => (0.006 + (Math.random() < 0.08 ? 0.04 : 0)) * kx()).color(0, 0, 1))
  .add(src(o2).scrollX(() => -0.004 * kx()).color(0, 0.45, 0))
  .mult(src(s1).scrollX(tk(0.03)).invert().add(solid(0.1, 0.06, 0.18)))
  .add(src(s0).scrollX(() => -0.005 * SPLIT + tk(0.05)()).color(1, 0.1, 0.75), 0.9)
  .add(src(s0).scrollX(() => 0.005 * SPLIT + tk(0.05)()).color(0.1, 0.9, 1), 0.9)
  .add(src(s0).scrollX(tk(0.02)).color(0.6, 0.6, 0.6))
  .modulateScrollX(noise(4, 0.7).scale(1, 120, 1).thresh(0.88), 0.04)
  .pixelate(() => mode !== 1 && Math.random() < 0.04 + vel * 0.2 ? 48 : 4000,
    () => mode !== 1 && Math.random() < 0.04 + vel * 0.2 ? 140 : 4000)
  // 3 · borrar realidad (huella del puntero)
  .add(src(s2).modulate(noise(4, 0.6), 0.05).color(0.1, 1, 0.85)
    .mult(osc(40, 0.2).rotate(Math.PI / 2).add(solid(0.3, 0.3, 0.3))),
    () => mode === 3 ? 0.8 : 0)
  .mult(osc(600, 0).rotate(Math.PI / 2).color(0.3, 0.3, 0.3).add(solid(0.7, 0.7, 0.7)))
  .out(o3)

render(o3)
</script>
</body>
</html>
